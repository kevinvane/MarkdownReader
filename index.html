<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:;">
  <title>MarkdownReader</title>
  <link rel="stylesheet" href="lib/github-markdown.min.css">
  <link id="hljs-theme" rel="stylesheet" href="lib/github-highlight.min.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>

  <div id="content" class="markdown-body">
    <p style="color: #6a737d; text-align: center; margin-top: 80px;">拖拽 .md 文件到窗口，或通过菜单 File > 打开文件 打开</p>
  </div>

  <aside id="outline-panel" class="outline-panel" hidden>
    <div class="outline-header">
      <span class="outline-title">大纲</span>
      <button id="outline-collapse-btn" class="outline-collapse-btn" type="button" title="折叠大纲" aria-label="折叠大纲">×</button>
    </div>
    <div id="outline-body" class="outline-body">
      <p class="outline-empty">该文档暂未检测到标题</p>
    </div>
  </aside>

  <button id="outline-toggle-collapsed" class="outline-restore-btn" hidden>大纲</button>

  <div id="search-panel" class="search-panel" hidden>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="输入关键词开始搜索" autocomplete="off" spellcheck="false">
      <button id="search-btn-case" class="search-toggle" type="button" title="大小写敏感 (当前: 关)" aria-pressed="false">Aa</button>
      <button id="search-btn-regex" class="search-toggle" type="button" title="正则表达式 (当前: 关)" aria-pressed="false">.*</button>
      <span id="search-count" class="search-count"></span>
    </div>
    <ul id="search-results" class="search-results"></ul>
    <div id="search-hint" class="search-hint"></div>
  </div>

  <div id="chart-lightbox" class="chart-lightbox" hidden>
    <div class="chart-lightbox-toolbar">
      <span class="chart-lightbox-title">Mermaid 图表</span>
      <div class="chart-lightbox-actions">
        <button id="chart-zoom-out" class="chart-btn" type="button" title="缩小">−</button>
        <span id="chart-zoom-level" class="chart-zoom-level">100%</span>
        <button id="chart-zoom-in" class="chart-btn" type="button" title="放大">＋</button>
        <button id="chart-zoom-reset" class="chart-btn" type="button" title="重置缩放">重置</button>
        <button id="chart-export-svg" class="chart-btn" type="button" title="导出为 SVG">导出 SVG</button>
        <button id="chart-export-png" class="chart-btn" type="button" title="导出为 PNG">导出 PNG</button>
        <button id="chart-lightbox-close" class="chart-btn chart-btn-close" type="button" title="关闭" aria-label="关闭">×</button>
      </div>
    </div>
    <div id="chart-lightbox-stage" class="chart-lightbox-stage"></div>
  </div>

  <script src="lib/markdown-it.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/mermaid.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
